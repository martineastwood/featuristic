name: CI

# This branch is Featuristic 2.0 (Nim). Do not treat a green run as a PyPI release.
on:
  push:
    branches: ["nim", "main"]
  pull_request:
    branches: ["nim", "main"]
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: pip install "ruff>=0.16.5"

      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .

  test-platform:
    name: Full suite on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-14
          - macos-15-intel
          - windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - uses: ./.github/actions/setup-nim

      - name: Install nuwa-build and package
        run: |
          pip install "nuwa-build>=0.5.3"
          pip install -e ".[test]"

      - name: Build extension
        run: nuwa develop

      - name: Tests
        run: pytest tests/ -v --tb=short

  test-python:
    name: Python ${{ matrix.python }} compatibility
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Python 3.12 receives the full suite in test-platform.
        python: ["3.10", "3.11", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - uses: ./.github/actions/setup-nim

      - name: Install and build
        run: |
          pip install "nuwa-build>=0.5.3"
          pip install -e ".[test]"
          nuwa develop

      - name: Run compatibility tests
        run: |
          pytest \
            tests/test_architecture_verification.py \
            tests/test_nim_integration.py \
            tests/test_integration_nuwa_sdk.py \
            tests/test_end_to_end.py \
            tests/test_sklearn_contracts.py \
            -v --tb=short
