name: CI

# This branch is Featuristic 2.0 (Nim). Do not treat a green run as a PyPI release.
on:
  push:
    branches: ["nim", "main"]
  pull_request:
    branches: ["nim", "main"]
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: pip install "ruff>=0.16.5"

      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .

  test:
    name: Test Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - uses: ./.github/actions/setup-nim

      - name: Install nuwa-build and package
        run: |
          pip install "nuwa-build>=0.5.2"
          pip install -e ".[dev,test]"

      - name: Build extension
        run: nuwa develop

      - name: Tests
        run: pytest tests/ -v --tb=short

  test-integration-lowlevel:
    name: Low-level integration tests (Nuwa SDK wrappers)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - uses: ./.github/actions/setup-nim

      - name: Install and build
        run: |
          pip install "nuwa-build>=0.5.2"
          pip install -e ".[test]"
          nuwa develop

      - name: Run low-level integration tests
        run: pytest tests/test_integration_nuwa_sdk.py -v --tb=short

  test-integration-e2e:
    name: End-to-end integration tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - uses: ./.github/actions/setup-nim

      - name: Install and build
        run: |
          pip install "nuwa-build>=0.5.2"
          pip install -e ".[test]"
          nuwa develop

      - name: Run end-to-end integration tests
        run: pytest tests/test_end_to_end.py -v --tb=short
