name: Build artifacts

# Wheels and sdist only. Does not publish to PyPI.

on:
  push:
    branches: ["nim", "main"]
  pull_request:
    branches: ["nim", "main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A push and its pull_request event can represent the same commit. Keep one.
  group: "${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}"
  cancel-in-progress: true

jobs:
  cibuildwheel:
    name: Wheel cp${{ matrix.python }} on ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python: ["310", "311", "312", "313", "314"]
        platform:
          - linux-x86_64
          - linux-arm64
          - windows-x86_64
          - macos-arm64
          - macos-x86_64
        include:
          - platform: linux-x86_64
            os: ubuntu-latest
            arch: x86_64
          - platform: linux-arm64
            os: ubuntu-24.04-arm
            arch: aarch64
          - platform: windows-x86_64
            os: windows-latest
            arch: AMD64
          - platform: macos-arm64
            os: macos-14
            arch: arm64
          - platform: macos-x86_64
            os: macos-15-intel
            arch: x86_64

    env:
      PYTHONUTF8: 1
      CIBW_ARCHS: "${{ matrix.arch }}"
      CIBW_BUILD: "cp${{ matrix.python }}-*"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build wheels
        uses: martineastwood/nuwa-build-action@297c4d536f3e4154431dedac55593a96b6b84df2
        with:
          nim-version: "2.2.10"
          cibw-version: "4.2.0"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cibw-wheel-${{ matrix.platform }}-cp${{ matrix.python }}
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - uses: ./.github/actions/setup-nim

      - name: Build sdist and install from it
        run: |
          pip install build "nuwa-build>=0.5.3"
          python -m build --sdist
          pip install dist/*.tar.gz
          # Run outside the checkout so imports resolve from the installed sdist.
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/tests/artifact_smoke.py"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error
