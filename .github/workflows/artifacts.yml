name: Build artifacts

# Wheels and sdist only. Does not publish to PyPI.

on:
  push:
    branches: ["nim", "main"]
  pull_request:
    branches: ["nim", "main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cibuildwheel:
    name: cibuildwheel on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    env:
      PYTHONUTF8: 1
      CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
      CIBW_SKIP: "*-musllinux_* *i686 *-win32"
      CIBW_TEST_COMMAND: "python {project}/tests/artifact_smoke.py"

    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: martineastwood/nuwa-build-action@v1
        with:
          nim-version: "2.2.10"
          cibw-version: "4.2.0"

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  pep517-wheel:
    name: PEP 517 wheel on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: ./.github/actions/setup-nim

      - name: Build and install wheel
        shell: bash
        run: |
          pip install build "nuwa-build>=0.5.3"
          python -m build --wheel
          pip install dist/*.whl
          # Run outside the checkout so imports resolve from the installed wheel.
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/tests/artifact_smoke.py"

      - uses: actions/upload-artifact@v4
        with:
          name: pep517-wheel-${{ matrix.os }}
          path: dist/*.whl

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: ./.github/actions/setup-nim

      - name: Build sdist and install from it
        run: |
          pip install build "nuwa-build>=0.5.3"
          python -m build --sdist
          pip install dist/*.tar.gz
          # Run outside the checkout so imports resolve from the installed sdist.
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/tests/artifact_smoke.py"

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
