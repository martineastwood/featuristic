name: Build artifacts

# Wheels and sdist only. Does not publish to PyPI.

on:
  push:
    branches: ["nim", "main"]
  pull_request:
    branches: ["nim", "main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  cibuildwheel:
    name: cibuildwheel on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
          - os: windows-latest
            arch: AMD64
          - os: macos-14
            arch: arm64
          - os: macos-15-intel
            arch: x86_64

    env:
      PYTHONUTF8: 1
      CIBW_ARCHS: "${{ matrix.arch }}"

    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: martineastwood/nuwa-build-action@v1
        with:
          nim-version: "2.2.10"
          cibw-version: "4.2.0"

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: ./.github/actions/setup-nim

      - name: Build sdist and install from it
        run: |
          pip install build "nuwa-build>=0.5.3"
          python -m build --sdist
          pip install dist/*.tar.gz
          # Run outside the checkout so imports resolve from the installed sdist.
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/tests/artifact_smoke.py"

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
